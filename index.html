<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>ANETİL Harf Macerası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: one winding sea map of islands; each island opens a short full-screen round. Single bright world, light only. */
:root{
  --sea:#2fb4c4; --sea-deep:#1b8ea3; --sand:#ffe8b0; --grass:#76c96a; --sun:#ffc63a;
  --coral:#ff7957; --ink:#24344f; --ink-soft:#5a6883; --card:#fffaf0; --line:#e5d6b4;
  --ok:#3fae5a; --soft-no:#f3b6a6; --lock:#a9b4c2;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--display);
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.18) 0 60px,transparent 61px),
  radial-gradient(circle at 85% 40%,rgba(255,255,255,.12) 0 90px,transparent 91px),
  linear-gradient(180deg,var(--sea) 0%,var(--sea-deep) 100%);background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;min-height:100%;box-sizing:border-box}

/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:10px}
.brand .fox{font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.brand h1{margin:0;font-size:clamp(22px,5vw,32px);line-height:1;color:#fff;text-shadow:0 3px 0 var(--sea-deep);font-weight:800;text-wrap:balance}
.brand small{display:block;font-size:14px;color:#e6fbff;font-weight:600;letter-spacing:.02em}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
.pill.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.notice{margin-top:10px;background:rgba(255,255,255,.9);border-radius:14px;padding:8px 12px;font-size:15px;color:var(--ink-soft)}

/* map */
.map{position:relative;margin-top:36px}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.isle{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:150px}
.isle .blob{width:104px;height:104px;border-radius:50% 50% 46% 54%/55% 52% 48% 45%;display:grid;place-items:center;font-size:52px;
  background:radial-gradient(circle at 50% 38%,var(--grass) 0 44%,var(--sand) 45% 70%,#f5d48a 71%);box-shadow:0 7px 0 rgba(0,0,0,.18),0 0 0 6px rgba(255,255,255,.35);transition:transform .15s}
.isle:active .blob{transform:scale(.94)}
.isle .name{background:var(--card);border-radius:12px;padding:2px 10px;font-weight:800;font-size:17px;line-height:1.3;box-shadow:0 3px 0 rgba(0,0,0,.12);text-align:center}
.isle .st{font-size:18px;letter-spacing:2px;height:22px;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.isle .st .off{color:rgba(255,255,255,.55);text-shadow:none}
.isle.locked .blob{filter:grayscale(1) brightness(1.05);opacity:.75}
.isle.locked .name{color:var(--ink-soft)}
.isle .lockico{position:absolute;top:58px;right:30px;font-size:28px}
.isle .resume{position:absolute;top:-6px;right:14px;background:var(--coral);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:2px 10px;box-shadow:0 3px 0 #c9553a}
.backup{margin-top:20px;display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px}
.backup span{font-size:15px;color:var(--ink-soft);font-weight:600;line-height:1.3}
.backup textarea,.backup input{font:600 14px/1.3 ui-monospace,Menlo,monospace;border:2px solid var(--line);border-radius:10px;padding:8px;width:100%;box-sizing:border-box;resize:none;color:var(--ink);background:var(--card);user-select:text;-webkit-user-select:text}
.backup .go{font-size:18px;padding:8px 18px}
#codeMsg{font-size:15px;font-weight:700;color:var(--ok);min-height:1em}
.isle.next .blob{animation:bob 1.6s ease-in-out infinite}
.isle .here{position:absolute;top:-34px;left:8px;font-size:40px;animation:hop 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes hop{50%{transform:translateY(-6px) rotate(-6deg)}}

/* play */
.bar{display:flex;align-items:center;gap:12px}
.back{background:var(--card);border-radius:16px;padding:8px 14px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.steps{flex:1;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.steps span{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-size:13px}
.steps span.done{background:var(--sun)}
.steps span.now{background:#fff;box-shadow:0 0 0 3px var(--sun)}
.panel{margin-top:14px;background:var(--card);border-radius:28px;padding:18px 16px 24px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.guide{display:flex;align-items:center;gap:10px}
.guide .fox{font-size:48px;line-height:1}
.bubble{flex:1;min-width:0;background:#fff;border:3px solid var(--line);border-radius:20px;padding:8px 14px;font-size:clamp(18px,4.4vw,22px);font-weight:700;line-height:1.25;position:relative}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.listen{width:62px;height:62px;border-radius:50%;background:var(--coral);color:#fff;font-size:30px;box-shadow:0 5px 0 #c9553a;flex:none}
.listen:active{transform:translateY(4px);box-shadow:0 1px 0 #c9553a}
.stage{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:18px}
.pic{font-size:84px;line-height:1.1}
.word{font-family:var(--read);font-size:clamp(44px,12vw,68px);font-weight:700;letter-spacing:.04em;line-height:1.1}
.word .gap{display:inline-block;min-width:.7em;border-bottom:6px solid var(--coral);color:var(--coral);text-align:center}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.choice{min-width:96px;min-height:96px;padding:6px 18px;border-radius:24px;background:#fff;border:4px solid var(--line);box-shadow:0 6px 0 var(--line);font-family:var(--read);font-weight:700;font-size:52px;line-height:1;transition:transform .1s}
.choice.small{font-size:36px}
.choice.emo{font-size:60px}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice.right{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 0 #2b8442}
.choice.nope{background:var(--soft-no);border-color:var(--soft-no);opacity:.55;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.letterwall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:420px}
.letterwall .choice{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px}
.letterwall .choice small{font-size:20px;font-family:var(--display);color:var(--ink-soft)}
.letterwall .choice.heard{background:#fff3c4;border-color:var(--sun);box-shadow:0 6px 0 #e0a92a}
.go{background:var(--grass);color:#fff;font-weight:800;font-size:26px;padding:12px 32px;border-radius:999px;box-shadow:0 6px 0 #4c9a41}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #4c9a41}
.go:disabled{background:var(--lock);box-shadow:0 6px 0 #8a95a3;cursor:default}
.go.alt{background:var(--coral);box-shadow:0 6px 0 #c9553a}
.blendrow{display:flex;align-items:center;gap:56px;transition:gap .6s cubic-bezier(.5,1.6,.5,1)}
.blendrow.joined{gap:0}
.blendrow .card{width:104px;height:120px;display:grid;place-items:center;background:#fff;border:4px solid var(--line);font-family:var(--read);font-weight:700;font-size:72px;border-radius:22px;transition:border-radius .5s,background .5s}
.blendrow .card.v{color:var(--coral)}
.blendrow.joined .card:first-child{border-radius:22px 0 0 22px;background:#fff3c4}
.blendrow.joined .card:last-child{border-radius:0 22px 22px 0;background:#fff3c4}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot{min-width:72px;height:84px;padding:0 10px;border-radius:18px;border:4px dashed var(--line);display:grid;place-items:center;font-family:var(--read);font-size:46px;font-weight:700;box-sizing:border-box}
.slot.fill{border-style:solid;border-color:var(--ok);background:#e8f7ea;animation:pop .3s}
.slots.sent .slot{min-width:64px;height:70px;font-size:32px}
@keyframes pop{50%{transform:scale(1.12)}}
.tile.used{visibility:hidden}
.sentence{font-family:var(--read);font-weight:700;font-size:clamp(34px,9vw,48px);display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;line-height:1.3}
.sentence button{font:inherit;padding:0 4px;border-radius:10px}
.sentence button.lit{background:#fff3c4}
.claps{font-size:46px;height:56px;letter-spacing:6px}
.claps span{display:inline-block;animation:pop .3s}

/* result + album */
.over{position:fixed;inset:0;overflow-y:auto;align-items:safe center;background:rgba(20,40,60,.55);display:grid;place-items:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));z-index:20}
.card-big{background:var(--card);border-radius:30px;padding:24px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);box-sizing:border-box}
.card-big h2{margin:0;font-size:34px;line-height:1.1}
.bigstars{font-size:62px;letter-spacing:6px;margin:8px 0;color:var(--sun);text-shadow:0 4px 0 #d79a12}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.bigstars .off{color:#e2dccd;text-shadow:none}
.newsticker{margin:8px auto 4px;width:130px;height:130px;border-radius:50%;background:#fff;border:6px dashed var(--sun);display:grid;place-items:center;font-size:76px;animation:spin .9s cubic-bezier(.4,1.6,.5,1) backwards .4s}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}}
.card-big p{font-size:19px;margin:8px 0 16px;color:var(--ink-soft);font-weight:600}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.album div{aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:clamp(34px,9vw,48px);box-shadow:0 4px 0 var(--line)}
.album div.empty{background:#efe6d2;color:#cbbd9c;font-size:28px;font-weight:800;box-shadow:none}
.reset{margin-top:22px;font-size:16px;color:var(--ink-soft);text-decoration:underline;font-weight:600}
.confirm{margin-top:12px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:17px;font-weight:700}

.fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fx i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="fox" aria-hidden="true">🦊</span><h1>ANETİL Harf Macerası<small>Tan ile ses ve hece avı</small></h1></div>
    <button class="pill btn" id="soundBtn" aria-label="Sesi aç/kapat">🔊</button>
    <button class="pill btn" id="albumBtn" aria-label="Sticker albümü">📒 <span id="stkCount">0</span></button>
    <div class="pill" aria-label="Toplam yıldız">⭐ <span id="starCount">0</span></div>
  </header>

  <section id="mapScreen">
    <div class="notice" id="voiceNote" hidden>Bu cihazda Türkçe ses bulunamadı. Sesler farklı bir aksanla çıkabilir.</div>
    <div class="map" id="map"></div>
  </section>

  <section id="playScreen" hidden>
    <div class="bar" style="margin-top:12px">
      <button class="back" id="backBtn">← Harita</button>
      <div class="steps" id="steps"></div>
    </div>
    <div class="panel">
      <div class="guide">
        <span class="fox" aria-hidden="true">🦊</span>
        <div class="bubble" id="bubble"></div>
        <button class="listen" id="listenBtn" aria-label="Tekrar dinle">🔊</button>
      </div>
      <div class="stage" id="stage"></div>
    </div>
  </section>
</div>
<div id="overlay"></div>
<div class="fx" id="fx"></div>

<script>
/* ---------- veri ---------- */
const L = ['a','n','e','t','i','l'];
const CONS = ['n','t','l'], VOW = ['a','e','i'];
// Ünsüzleri tek başına söyletiyoruz; motor harfi kendi bildiği gibi okur.
const SND = {a:'a', n:'n', e:'e', t:'t', i:'i', l:'l'};
const LW = {a:['at','🐴'], n:['nane','🌿'], e:['el','✋'], t:['tel','🧵'], i:['ilan','📢'], l:['lale','🌷']};
const SYLS = ['na','ne','ni','ta','te','ti','la','le','li','an','en','in','at','et','al','el','il'];
const WORDS = [
  {w:'at',s:['at'],e:'🐴'},{w:'et',s:['et'],e:'🥩'},{w:'el',s:['el'],e:'✋'},{w:'tel',s:['tel'],e:'🧵'},{w:'tat',s:['tat'],e:'😋'},{w:'alt',s:['alt'],e:'⬇️'},
  {w:'ana',s:['a','na'],e:'👩'},{w:'anne',s:['an','ne'],e:'👩‍👧'},{w:'nine',s:['ni','ne'],e:'👵'},{w:'nane',s:['na','ne'],e:'🌿'},
  {w:'lale',s:['la','le'],e:'🌷'},{w:'lila',s:['li','la'],e:'💜'},{w:'alet',s:['a','let'],e:'🔧'},{w:'ilan',s:['i','lan'],e:'📢'},
  {w:'atla',s:['at','la'],e:'🦘'},{w:'tatil',s:['ta','til'],e:'🏖️'},{w:'anten',s:['an','ten'],e:'📡'},{w:'telli',s:['tel','li'],e:'🎸'},
  {w:'anlat',s:['an','lat'],e:'🗣️'},{w:'ilet',s:['i','let'],e:'📨'},{w:'Ali',s:['A','li'],e:'👦'},{w:'Ela',s:['E','la'],e:'👧'},
  {w:'Atilla',s:['A','til','la'],e:'🧒'},{w:'naneli',s:['na','ne','li'],e:'🍵'},{w:'laleli',s:['la','le','li'],e:'💐'},
  {w:'anneanne',s:['an','ne','an','ne'],e:'👵'}
];
const SENT = [
  {t:'Ali, atla!',e:'🦘'},{t:'Ela lale al.',e:'🌷'},{t:'Nine nane al.',e:'🌿'},{t:'Anne, tel al.',e:'🧵'},
  {t:'Ali ile Ela.',e:'👫'},{t:'Anne, anlat!',e:'🗣️'},{t:'Ela, tatil!',e:'🏖️'},{t:'Ali, anten al.',e:'📡'}
];
const ISLANDS = [
  {name:'Ses Adası',icon:'🌴',sticker:'🦜',plan:['meet','pickLetter','startLetter','pickLetter','startLetter','pickLetter','startLetter']},
  {name:'Hece Köprüsü',icon:'🌉',sticker:'🐢',plan:['blend','buildSyl','blend','buildSyl','blend','buildSyl']},
  {name:'Kelime Ormanı',icon:'🌳',sticker:'🦁',plan:['buildWord','buildWord','buildWord','buildWord','buildWord','buildWord']},
  {name:'Hece Şelalesi',icon:'💦',sticker:'🐬',plan:['countSyl','splitWord','countSyl','splitWord','countSyl','splitWord']},
  {name:'Eksik Harf Mağarası',icon:'🦇',sticker:'💎',plan:['missing','missing','missing','missing','missing','missing']},
  {name:'Cümle Kalesi',icon:'🏰',sticker:'👑',plan:['sentPic','sentOrder','sentPic','sentOrder','sentPic','sentOrder']},
  {name:'Hazine Adası',icon:'💰',sticker:'🏆',plan:'mix'}
];
const EXTRA = ['🐙','🦄','🐲','🚀','⛵','🗺️','🌈','⭐','🍦','🎈','🦖','🐝','🌻','🍉','🦋','🐳','🧁'];
const ALL_STICKERS = [...ISLANDS.map(i=>i.sticker), ...EXTRA];
const PRAISE = ['Harika!','Süper!','Aferin!','Çok güzel!','Bravo!','Muhteşem!'];
const TRY = ['Bir daha dene!','Neredeyse!','Sen yaparsın!'];

/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const pickN = (a,n,ex=[]) => shuffle(a.filter(x=>!ex.includes(x))).slice(0,n);
const up = s => s.toLocaleUpperCase('tr');
const low = s => s.toLocaleLowerCase('tr');

/* ---------- kayıt ---------- */
const KEY = 'anetil-macera-v1';
let save = {stars:{}, plays:{}, stickers:[], sound:true};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) save = Object.assign(save, s); } catch(e){}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} };
// Tarayıcıdan kaydı kendiliğinden silmemesini iste (destekleyen tarayıcılarda).
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
// Yedek kodu: yıldızlar + stickerlar, başka cihaza veya temizlenen tarayıcıya taşımak için.
function makeCode(){ const d={s:save.stars,p:save.plays,k:save.stickers.map(x=>ALL_STICKERS.indexOf(x)).filter(x=>x>=0)}; return 'TAN-'+btoa(JSON.stringify(d)); }
function readCode(c){ try { const d=JSON.parse(atob(String(c).trim().replace(/^TAN-/i,''))); if(!d||typeof d.s!=='object'||!Array.isArray(d.k)) return null;
  return {stars:d.s, plays:d.p||{}, stickers:d.k.map(i=>ALL_STICKERS[i]).filter(Boolean)}; } catch(e){ return null; } }

/* ---------- ses ---------- */
let trVoice = null;
function loadVoices(){ try { const v = speechSynthesis.getVoices(); trVoice = v.find(x=>/^tr/i.test(x.lang)) || null; if (v.length) $('#voiceNote').hidden = !!trVoice; } catch(e){} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(parts, rate=0.8){
  if (!save.sound || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    (Array.isArray(parts)?parts:[parts]).forEach(p=>{
      const u = new SpeechSynthesisUtterance(p.t ?? p); u.lang='tr-TR'; if (trVoice) u.voice=trVoice;
      u.rate = p.r ?? rate; u.pitch = 1.1; speechSynthesis.speak(u);
    });
  } catch(e){}
}
let actx;
function tone(freqs, d=0.11){
  if (!save.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*d); g.gain.exponentialRampToValueAtTime(0.22,t+i*d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*d+d*2);
      o.connect(g).connect(actx.destination); o.start(t+i*d); o.stop(t+i*d+d*2.2); });
  } catch(e){}
}

/* ---------- soru üreticiler ---------- */
function wrongSplits(w){
  const word = low(w.w), b=[]; let p=0; w.s.slice(0,-1).forEach(x=>{p+=x.length; b.push(p);});
  const cut = bs => { const o=[]; let prev=0; bs.forEach(x=>{o.push(word.slice(prev,x)); prev=x;}); o.push(word.slice(prev)); return o.join('-'); };
  const res = new Set();
  b.forEach((pos,i)=>[-1,1].forEach(d=>{ const nb=b.slice(); nb[i]=pos+d; if (nb.every((v,k)=>v>0 && v<word.length && (k===0||v>nb[k-1]))) res.add(cut(nb)); }));
  res.add(word.split('').join('-')); res.delete(low(w.s.join('-')));
  return shuffle([...res]).slice(0,2);
}
const G = {
  meet: () => ({type:'meet', key:'meet'}),
  pickLetter(){ const a=rnd(L); return {type:'pickLetter', key:'p'+a, answer:a, options:shuffle([a,...pickN(L,2,[a])])}; },
  startLetter(){ const a=rnd(L); return {type:'startLetter', key:'s'+a, answer:a, word:LW[a][0], emoji:LW[a][1], options:shuffle([a,...pickN(L,2,[a])])}; },
  blend(){
    const c=rnd(CONS), v=rnd(VOW), cv=Math.random()<.65, parts=cv?[c,v]:[v,c], ans=parts.join('');
    const opts=new Set([ans, parts.slice().reverse().join('')]);
    while (opts.size<3){ const c2=rnd(CONS), v2=rnd(VOW); opts.add(cv?c2+v2:v2+c2); }
    return {type:'blend', key:'b'+ans, parts, answer:ans, options:shuffle([...opts])};
  },
  buildSyl(){ const c=rnd(CONS), v=rnd(VOW), parts=Math.random()<.6?[c,v]:[v,c];
    return {type:'buildSyl', key:'y'+parts.join(''), parts, answer:parts.join(''), pool:shuffle([...parts,...pickN(L,2,parts)])}; },
  buildWord(){ const w=rnd(WORDS.filter(x=>x.s.length>=2)); const ex=rnd(SYLS.filter(s=>!w.s.map(low).includes(s)));
    return {type:'buildWord', key:'w'+w.w, w, pool:shuffle([...w.s, ex])}; },
  countSyl(){ const n=rnd([1,2,2,3,3,4]); const w=rnd(WORDS.filter(x=>x.s.length===n)); return {type:'countSyl', key:'c'+w.w, w, answer:n}; },
  splitWord(){ const w=rnd(WORDS.filter(x=>x.s.length>=2 && x.w.length<=6)); const right=low(w.s.join('-'));
    return {type:'splitWord', key:'x'+w.w, w, answer:right, options:shuffle([right,...wrongSplits(w)])}; },
  missing(){ const w=rnd(WORDS.filter(x=>x.w.length>=3 && x.w.length<=6)); const idx=Math.floor(Math.random()*w.w.length);
    const ch=w.w[idx], ans=low(ch), big=ch!==ans;
    return {type:'missing', key:'m'+w.w+idx, w, idx, answer:ans, big, options:shuffle([ans,...pickN(L,2,[ans])])}; },
  sentPic(){ const s=rnd(SENT); return {type:'sentPic', key:'q'+s.t, s, answer:s.e, options:shuffle([s.e,...pickN([...new Set(SENT.map(x=>x.e))],2,[s.e])])}; },
  sentOrder(){ const s=rnd(SENT), words=s.t.split(' '); let pool=shuffle(words); while (pool.join(' ')===s.t) pool=shuffle(words);
    return {type:'sentOrder', key:'o'+s.t, s, words, pool}; }
};
function buildRound(plan){
  if (plan==='mix') plan = Array.from({length:8},()=>rnd(Object.keys(G).filter(k=>k!=='meet')));
  const seen=new Set(), out=[];
  plan.forEach(t=>{ let q; for (let i=0;i<12;i++){ q=G[t](); if(!seen.has(q.key)) break; } seen.add(q.key); out.push(q); });
  return out;
}

/* ---------- harita ---------- */
const POS = [[24,0],[72,1],[30,2],[74,3],[26,4],[70,5],[50,6]];
const STEP = 170, TOP = 90;
function totalStars(){ return Object.values(save.stars).reduce((a,b)=>a+b,0); }
function unlocked(i){ return i===0 || save.stars[i-1]>0; }
function renderHeader(){
  $('#starCount').textContent = totalStars();
  $('#stkCount').textContent = save.stickers.length;
  $('#soundBtn').textContent = save.sound ? '🔊' : '🔇';
}
function renderMap(){
  renderHeader();
  const m=$('#map'); m.innerHTML='';
  const H = TOP*2 + STEP*(ISLANDS.length-1);
  m.style.height = H+'px';
  const pts = POS.map(([x,i])=>[x, TOP+i*STEP]);
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; d+=` C${x0} ${y0+STEP/2} ${x1} ${y1-STEP/2} ${x1} ${y1}`; }
  m.innerHTML = `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16" vector-effect="non-scaling-stroke"/></svg>`;
  const nextIdx = ISLANDS.findIndex((_,i)=>unlocked(i) && !save.stars[i]);
  ISLANDS.forEach((isl,i)=>{
    const lock=!unlocked(i), s=save.stars[i]||0;
    const b=el('button','isle'+(lock?' locked':'')+(i===nextIdx?' next':''));
    b.style.left=pts[i][0]+'%'; b.style.top=pts[i][1]+'px';
    b.innerHTML = `<span class="blob">${isl.icon}</span><span class="name">${isl.name}</span>`+
      `<span class="st">${lock?'':[0,1,2].map(k=>`<span class="${k<s?'':'off'}">★</span>`).join('')}</span>`+
      (lock?'<span class="lockico">🔒</span>':'')+(i===nextIdx?'<span class="here" aria-hidden="true">🦊</span>':'')+(save.cur&&save.cur.level===i?'<span class="resume">▶ Devam</span>':'');
    b.setAttribute('aria-label', isl.name + (lock?' (kilitli)':''));
    b.onclick = () => { if (lock){ tone([300,240]); say('Önce önceki adayı bitir!'); b.animate([{transform:'translate(-50%,-50%) rotate(-4deg)'},{transform:'translate(-50%,-50%) rotate(4deg)'},{transform:'translate(-50%,-50%)'}],{duration:300}); } else startLevel(i); };
    m.append(b);
  });
}

/* ---------- oyun ---------- */
let G_level=0, round=[], qi=0, mistakes=0, busy=false, replay=()=>{};
function show(id){ ['mapScreen','playScreen'].forEach(s=>$('#'+s).hidden = s!==id); window.scrollTo(0,0); }
function startLevel(i, fresh){
  G_level=i; const c=save.cur;
  if (!fresh && c && c.level===i && Array.isArray(c.round) && c.qi<c.round.length){ round=c.round; qi=c.qi; mistakes=c.mistakes||0; }
  else { round=buildRound(ISLANDS[i].plan); qi=0; mistakes=0; }
  show('playScreen'); nextQ();
}
function renderSteps(){ const s=$('#steps'); s.innerHTML=''; round.forEach((_,k)=>s.append(el('span',k<qi?'done':k===qi?'now':'',k<qi?'🐾':''))); }
function praise(){ busy=true; tone([523,659,784,1046]); burst(); say(rnd(PRAISE), .95); setTimeout(()=>{ qi++; qi<round.length?nextQ():finish(); }, 1500); }
function oops(b, keep){ mistakes++; tone([330,262],.13); if(b && keep){ b.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:300}); } else if(b){ b.classList.add('nope'); b.disabled=true; } say(rnd(TRY), .95); }
function choices(opts, fmt, isRight, cls='', after){
  const row=el('div','choices');
  opts.forEach(o=>{ const b=el('button','choice '+cls, fmt(o)); b.onclick=()=>{ if(busy) return; if(isRight(o)){ b.classList.add('right'); if(after) after(o); praise(); } else oops(b); }; row.append(b); });
  return row;
}
const cased = (ch,big) => big ? up(ch) : ch;

function nextQ(){
  busy=false; renderSteps();
  save.cur={level:G_level, round, qi, mistakes}; persist();
  const q=round[qi], st=$('#stage'); st.innerHTML='';
  const speakAfter = (prompt, parts) => { replay=()=>say(parts); $('#bubble').textContent=prompt; say([prompt, ...parts]); };
  $('#listenBtn').hidden=false;

  switch(q.type){
  case 'meet': {
    $('#bubble').textContent='Harflerle tanış! Her harfe dokun, sesini dinle.';
    replay=()=>say('Harflerle tanış! Her harfe dokun, sesini dinle.'); replay();
    const wall=el('div','letterwall'), heard=new Set(), go=el('button','go','Hazırım!'); go.disabled=true;
    L.forEach(a=>{ const b=el('button','choice',`${up(a)} ${a}<small>${LW[a][1]} ${LW[a][0]}</small>`);
      b.onclick=()=>{ say([SND[a], {t:LW[a][0], r:.7}]); b.classList.add('heard'); heard.add(a); tone([660]); if(heard.size===L.length){ go.disabled=false; go.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:500}); } };
      wall.append(b); });
    go.onclick=()=>{ if(!busy) praise(); };
    st.append(wall, go); break;
  }
  case 'pickLetter':
    speakAfter('Sesi dinle. Hangi harf?', [{t:SND[q.answer], r:.6}]);
    st.append(el('div','pic','👂'), choices(q.options, o=>o, o=>o===q.answer)); break;
  case 'startLetter':
    speakAfter('Bu kelime hangi sesle başlıyor?', [{t:q.word, r:.6}]);
    st.append(el('div','pic',q.emoji), el('div','word',q.word.replace(/^./,'<span class="gap">?</span>')),
      choices(q.options, o=>o, o=>o===q.answer, '', ()=>{ st.querySelector('.word').textContent=q.word; }));
    break;
  case 'blend': {
    const row=el('div','blendrow'); q.parts.forEach(p=>row.append(el('div','card'+(VOW.includes(p)?' v':''),p)));
    const btn=el('button','go alt','Birleştir!');
    const doBlend=()=>{ row.classList.add('joined'); say([{t:q.parts[0],r:.5},{t:q.parts[1],r:.5},{t:q.answer,r:.55}]); };
    btn.onclick=doBlend;
    $('#bubble').textContent='İki sesi birleştir! Hangi hece oldu?'; say('İki sesi birleştir! Hangi hece oldu?');
    replay=doBlend;
    st.append(row, btn, choices(q.options, o=>o, o=>o===q.answer, 'small')); break;
  }
  case 'buildSyl': {
    speakAfter('Duyduğun heceyi kur!', [{t:q.answer, r:.55}]);
    const slots=el('div','slots'); q.parts.forEach(()=>slots.append(el('div','slot','')));
    let k=0; const pool=el('div','choices');
    q.pool.forEach(p=>{ const b=el('button','choice tile',p); b.onclick=()=>{ if(busy) return;
      if(p===q.parts[k]){ slots.children[k].textContent=p; slots.children[k].classList.add('fill'); b.classList.add('used'); tone([660]); say({t:p,r:.6}); k++; if(k===q.parts.length){ setTimeout(()=>say({t:q.answer,r:.6}),300); praise(); } }
      else oops(b,true); }; pool.append(b); });
    st.append(el('div','pic','🌉'), slots, pool); break;
  }
  case 'buildWord': {
    const sy=q.w.s; speakAfter('Heceleri sırayla diz, kelimeyi kur!', [{t:q.w.w, r:.6}]);
    const slots=el('div','slots'); sy.forEach(()=>slots.append(el('div','slot','')));
    let k=0; const pool=el('div','choices');
    q.pool.forEach(p=>{ const b=el('button','choice small tile',p); b.onclick=()=>{ if(busy) return;
      if(p===sy[k]){ slots.children[k].textContent=p; slots.children[k].classList.add('fill'); b.classList.add('used'); tone([660]); k++;
        if(k===sy.length){ busy=true; say([...sy.map(s=>({t:low(s),r:.55})), {t:q.w.w,r:.7}]); setTimeout(()=>{ busy=false; praise(); }, 400); } else say({t:low(p),r:.6}); }
      else oops(b,true); }; pool.append(b); });
    st.append(el('div','pic',q.w.e), slots, pool); break;
  }
  case 'countSyl': {
    speakAfter('Kelimeyi alkışla! Kaç hece var?', [{t:q.w.w, r:.6}]);
    const claps=el('div','claps',''), btn=el('button','go alt','👏 Alkışla');
    btn.onclick=()=>{ claps.innerHTML=''; say(q.w.s.map(s=>({t:low(s),r:.5})));
      q.w.s.forEach((_,k)=>setTimeout(()=>{ claps.append(el('span','','👏')); tone([440+k*80]); }, 200+k*700)); };
    st.append(el('div','pic',q.w.e), el('div','word',q.w.w), btn, claps,
      choices([1,2,3,4], o=>String(o), o=>o===q.answer)); break;
  }
  case 'splitWord':
    speakAfter('Hangisi doğru hecelenmiş?', [{t:q.w.w, r:.6}]);
    st.append(el('div','pic',q.w.e), choices(q.options, o=>o, o=>o===q.answer, 'small', ()=>say(q.w.s.map(s=>({t:low(s),r:.55}))))); break;
  case 'missing': {
    speakAfter('Eksik harfi bul!', [{t:q.w.w, r:.6}]);
    const w=q.w.w, wd=el('div','word', w.slice(0,q.idx)+'<span class="gap">?</span>'+w.slice(q.idx+1));
    st.append(el('div','pic',q.w.e), wd, choices(q.options, o=>cased(o,q.big), o=>o===q.answer, '', ()=>{ wd.textContent=w; })); break;
  }
  case 'sentPic': {
    $('#bubble').textContent='Cümleyi oku. Hangi resim?'; say('Cümleyi oku. Hangi resim?');
    const sen=el('div','sentence');
    q.s.t.split(' ').forEach(w=>{ const b=el('button','',w); b.onclick=()=>{ say({t:w.replace(/[.,!]/g,''),r:.6}); b.classList.add('lit'); }; sen.append(b); });
    replay=()=>say({t:q.s.t, r:.6});
    st.append(sen, choices(q.options, o=>o, o=>o===q.answer, 'emo', ()=>say({t:q.s.t,r:.7}))); break;
  }
  case 'sentOrder': {
    speakAfter('Cümleyi dinle, kelimeleri sırala!', [{t:q.s.t, r:.6}]);
    const slots=el('div','slots sent'); q.words.forEach(()=>slots.append(el('div','slot','')));
    let k=0; const pool=el('div','choices');
    q.pool.forEach(p=>{ const b=el('button','choice small tile',p); b.onclick=()=>{ if(busy) return;
      if(p===q.words[k]){ slots.children[k].textContent=p; slots.children[k].classList.add('fill'); b.classList.add('used'); tone([660]); say({t:p.replace(/[.,!]/g,''),r:.6}); k++;
        if(k===q.words.length){ setTimeout(()=>say({t:q.s.t,r:.7}),400); praise(); } }
      else oops(b,true); }; pool.append(b); });
    st.append(el('div','pic',q.s.e), slots, pool); break;
  }
  }
}

function finish(){
  const i=G_level, stars = mistakes<=1?3:mistakes<=4?2:1;
  const first = !save.plays[i];
  delete save.cur;
  save.plays[i]=(save.plays[i]||0)+1;
  save.stars[i]=Math.max(save.stars[i]||0, stars);
  let sticker=null;
  if (!save.stickers.includes(ISLANDS[i].sticker)) sticker=ISLANDS[i].sticker;
  else { const left=EXTRA.filter(s=>!save.stickers.includes(s)); if(left.length) sticker=rnd(left); }
  if (sticker) save.stickers.push(sticker);
  persist(); renderHeader();
  const msg = stars===3?'Süper! Hepsini buldun!':stars===2?'Çok iyi gidiyorsun!':'Bitirdin! Tekrar oynarsan daha çok yıldız alırsın.';
  const nextOpen = i<ISLANDS.length-1 && first;
  $('#overlay').innerHTML = `<div class="over"><div class="card-big">
    <h2>${ISLANDS[i].name} bitti!</h2>
    <div class="bigstars">${[0,1,2].map(k=>`<span class="${k<stars?'':'off'}" style="animation-delay:${k*.25}s">★</span>`).join('')}</div>
    ${sticker?`<div class="newsticker">${sticker}</div><p>Yeni sticker albümüne eklendi!</p>`:`<p>Albümün tamamen doldu. Harikasın!</p>`}
    ${nextOpen?`<p>Yeni ada açıldı: <b>${ISLANDS[i+1].name}</b> ${ISLANDS[i+1].icon}</p>`:''}
    <div class="btnrow"><button class="go" id="toMap">Haritaya dön</button><button class="go alt" id="again">Tekrar oyna</button></div>
  </div></div>`;
  tone([523,659,784,1046,1318],.13); burst(); burst();
  say([msg, ...(sticker?['Yeni bir sticker kazandın!']:[])], .9);
  $('#toMap').onclick=()=>{ $('#overlay').innerHTML=''; show('mapScreen'); renderMap(); };
  $('#again').onclick=()=>{ $('#overlay').innerHTML=''; startLevel(i, true); };
}

/* ---------- albüm ---------- */
function openAlbum(){
  const have=save.stickers;
  $('#overlay').innerHTML = `<div class="over"><div class="card-big">
    <h2>Sticker Albümüm</h2><p>${have.length} / ${ALL_STICKERS.length} sticker topladın. Her bitirdiğin ada yeni bir tane verir!</p>
    <div class="album">${ALL_STICKERS.map(s=>have.includes(s)?`<div>${s}</div>`:'<div class="empty">?</div>').join('')}</div>
    <div class="btnrow" style="margin-top:18px"><button class="go" id="closeAlbum">Kapat</button></div>
    <div class="backup"><b>Anne-baba için yedek kodu</b><span>İlerleme bu cihazda kendiliğinden kaydedilir. Tarayıcı temizlenirse ya da başka cihaza geçerseniz bu kodla geri yükleyin.</span>
      <textarea id="codeOut" readonly rows="2"></textarea><button class="go" id="copyCode">Kodu kopyala</button>
      <input id="codeIn" placeholder="Yedek kodunu buraya yapıştır" autocomplete="off"><button class="go alt" id="loadCode">Kodu yükle</button><div id="codeMsg" role="status"></div></div>
    <button class="reset" id="resetBtn">Baştan başla</button><div id="confirmBox"></div>
  </div></div>`;
  $('#closeAlbum').onclick=()=>{ $('#overlay').innerHTML=''; };
  $('#codeOut').value=makeCode();
  $('#copyCode').onclick=()=>{ const t=$('#codeOut'); const done=()=>$('#codeMsg').textContent='Kopyalandı. Bir yere not edin.';
    try { navigator.clipboard.writeText(t.value).then(done,()=>{ t.select(); $('#codeMsg').textContent='Kod seçildi, kopyalayın.'; }); } catch(e){ t.select(); } };
  $('#loadCode').onclick=()=>{ const d=readCode($('#codeIn').value);
    if(!d){ $('#codeMsg').textContent='Bu kod okunamadı. TAN- ile başlayan kodun tamamını yapıştırın.'; return; }
    // Kayıp olmasın: mevcut ilerlemeyle birleştir, her adada en iyi yıldız kalsın.
    Object.entries(d.stars).forEach(([k,v])=>save.stars[k]=Math.max(save.stars[k]||0,v));
    Object.entries(d.plays).forEach(([k,v])=>save.plays[k]=Math.max(save.plays[k]||0,v));
    d.stickers.forEach(x=>{ if(!save.stickers.includes(x)) save.stickers.push(x); });
    persist(); renderMap(); openAlbum(); $('#codeMsg').textContent='İlerleme geri yüklendi!'; };
  $('#resetBtn').onclick=()=>{ $('#confirmBox').innerHTML='<div class="confirm">Tüm yıldızlar ve stickerlar silinsin mi? <button class="go alt" id="yes">Evet</button><button class="go" id="no">Hayır</button></div>';
    $('#yes').onclick=()=>{ save={stars:{},plays:{},stickers:[],sound:save.sound}; persist(); $('#overlay').innerHTML=''; show('mapScreen'); renderMap(); };
    $('#no').onclick=()=>{ $('#confirmBox').innerHTML=''; }; };
}

/* ---------- efekt ---------- */
function burst(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx=$('#fx'), cols=['#ffc63a','#ff7957','#76c96a','#2fb4c4','#b07cff'];
  for (let i=0;i<26;i++){ const c=el('i'); c.style.left='50%'; c.style.top='45%'; c.style.background=rnd(cols);
    c.style.setProperty('--dx',(Math.random()*500-250)+'px'); c.style.setProperty('--dy',(Math.random()*-320+120)+'px');
    fx.append(c); setTimeout(()=>c.remove(),1200); }
}

/* ---------- bağla ---------- */
$('#backBtn').onclick=()=>{ try{speechSynthesis.cancel();}catch(e){} show('mapScreen'); renderMap(); };
$('#listenBtn').onclick=()=>replay();
$('#albumBtn').onclick=openAlbum;
$('#soundBtn').onclick=()=>{ save.sound=!save.sound; persist(); renderHeader(); if(!save.sound) try{speechSynthesis.cancel();}catch(e){} else say('Ses açık!'); };
renderMap();
</script>
