<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Dikkat Macerası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: sakin bir orman haritası; her durak tek görevli kısa bir tur açar. Zamanlayıcı yok, tek ekranda tek iş. Light only. */
:root{
  --bg:#7cc4a4; --bg-deep:#4f9f84; --sand:#ffe8b0; --grass:#76c96a; --sun:#ffc63a;
  --coral:#ff7957; --ink:#24344f; --ink-soft:#5a6883; --card:#fffaf0; --line:#e5d6b4;
  --ok:#3fae5a; --soft-no:#f3b6a6; --lock:#a9b4c2; --leaf:#5fae6e;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);
  background-image:linear-gradient(180deg,var(--bg) 0%,var(--bg-deep) 100%);background-attachment:fixed;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;min-height:100%;box-sizing:border-box}

/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:10px}
.brand .fox{font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.brand h1{margin:0;font-size:clamp(22px,5vw,32px);line-height:1;color:#fff;text-shadow:0 3px 0 var(--bg-deep);font-weight:800;text-wrap:balance}
.brand small{display:block;font-size:14px;color:#effff6;font-weight:600;letter-spacing:.02em}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
.pill.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.notice{margin-top:10px;background:rgba(255,255,255,.9);border-radius:14px;padding:8px 12px;font-size:15px;color:var(--ink-soft)}

/* map */
.map{position:relative;margin-top:36px}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.isle{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:160px}
.isle .blob{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:52px;
  background:radial-gradient(circle at 50% 40%,#fff 0 42%,var(--sand) 43% 70%,#f5d48a 71%);box-shadow:0 7px 0 rgba(0,0,0,.18),0 0 0 6px rgba(255,255,255,.35);transition:transform .15s}
.isle:active .blob{transform:scale(.94)}
.isle .name{background:var(--card);border-radius:12px;padding:2px 10px;font-weight:800;font-size:17px;line-height:1.3;box-shadow:0 3px 0 rgba(0,0,0,.12);text-align:center}
.isle .st{font-size:18px;letter-spacing:2px;height:22px;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.isle .st .off{color:rgba(255,255,255,.55);text-shadow:none}
.isle.locked .blob{filter:grayscale(1) brightness(1.05);opacity:.75}
.isle.locked .name{color:var(--ink-soft)}
.isle .lockico{position:absolute;top:58px;right:34px;font-size:28px}
.isle .resume{position:absolute;top:-6px;right:14px;background:var(--coral);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:2px 10px;box-shadow:0 3px 0 #c9553a}
.isle.next .blob{animation:bob 2s ease-in-out infinite}
.isle .here{position:absolute;top:-34px;left:8px;font-size:40px}
@keyframes bob{50%{transform:translateY(-6px)}}
.backup{margin-top:20px;display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px}
.backup span{font-size:15px;color:var(--ink-soft);font-weight:600;line-height:1.3}
.backup textarea,.backup input{font:600 14px/1.3 ui-monospace,Menlo,monospace;border:2px solid var(--line);border-radius:10px;padding:8px;width:100%;box-sizing:border-box;resize:none;color:var(--ink);background:var(--card);user-select:text;-webkit-user-select:text}
.backup .go{font-size:18px;padding:8px 18px}
#codeMsg{font-size:15px;font-weight:700;color:var(--ok);min-height:1em}

/* play */
.bar{display:flex;align-items:center;gap:12px}
.back{background:var(--card);border-radius:16px;padding:8px 14px;font-weight:800;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.steps{flex:1;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.steps span{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-size:13px}
.steps span.done{background:var(--sun)}
.steps span.now{background:#fff;box-shadow:0 0 0 3px var(--sun)}
.panel{margin-top:14px;background:var(--card);border-radius:28px;padding:18px 16px 24px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.guide{display:flex;align-items:center;gap:10px}
.guide .fox{font-size:48px;line-height:1}
.bubble{flex:1;min-width:0;background:#fff;border:3px solid var(--line);border-radius:20px;padding:8px 14px;font-size:clamp(18px,4.4vw,22px);font-weight:700;line-height:1.25;position:relative}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--line);border-left:0}
.listen{width:62px;height:62px;border-radius:50%;background:var(--coral);color:#fff;font-size:30px;box-shadow:0 5px 0 #c9553a;flex:none}
.listen:active{transform:translateY(4px);box-shadow:0 1px 0 #c9553a}
.stage{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:18px}
.target{min-width:120px;min-height:120px;padding:0 20px;border-radius:26px;background:#fff3c4;border:4px solid var(--sun);display:grid;place-items:center;font-family:var(--read);font-weight:700;font-size:72px;line-height:1;box-sizing:border-box}
.target.emo{font-size:84px}
.shadow{filter:brightness(0) opacity(.7)}
.word{font-family:var(--read);font-size:clamp(36px,10vw,52px);font-weight:700;letter-spacing:.04em;line-height:1.1;min-height:1.1em}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.choice{min-width:96px;min-height:96px;padding:6px 18px;border-radius:24px;background:#fff;border:4px solid var(--line);box-shadow:0 6px 0 var(--line);font-family:var(--read);font-weight:700;font-size:52px;line-height:1;transition:transform .1s,background .2s}
.choice.emo{font-size:60px;padding:6px 10px}
.choice.mid{font-size:40px}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice.right{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 0 #2b8442}
.choice.nope{background:var(--soft-no);border-color:var(--soft-no);opacity:.55;animation:shake .4s}
.choice.lit{background:#fff3c4;border-color:var(--sun);box-shadow:0 6px 0 #e0a92a;transform:scale(1.08)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.grid{display:grid;gap:10px;width:100%;max-width:420px}
.grid .choice{width:100%;min-width:0;min-height:0;aspect-ratio:1;padding:0;font-size:clamp(28px,8vw,44px);display:grid;place-items:center}
.grid .choice.emo{font-size:clamp(34px,9vw,52px)}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.huntrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:460px}
.huntrow .choice{min-width:64px;min-height:72px;font-size:42px;padding:4px 12px}
.huntrow .choice.w{font-size:34px;min-width:110px}
.count{font-size:22px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.card{background:var(--leaf);border-color:#4c9a5a;box-shadow:0 6px 0 #4c9a5a;color:#fff}
.card.open{background:#fff;border-color:var(--line);box-shadow:0 6px 0 var(--line);color:var(--ink)}
.card.mine{background:#e8f7ea;border-color:var(--ok);box-shadow:0 6px 0 #9fd7aa;color:var(--ink)}
.card .wd{font-size:clamp(22px,6vw,32px)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .item{width:84px;height:84px;border-radius:20px;background:#fff;border:4px solid var(--line);display:grid;place-items:center;font-size:52px;font-family:var(--read);font-weight:700;box-sizing:border-box}
.row .item.syl{font-size:36px}
.row .item.q{border-style:dashed;border-color:var(--coral);color:var(--coral);font-size:46px}
.row .item.hide{background:var(--leaf);border-color:#4c9a5a;font-size:40px}
.go{background:var(--grass);color:#fff;font-weight:800;font-size:26px;padding:12px 32px;border-radius:999px;box-shadow:0 6px 0 #4c9a41}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #4c9a41}
.go.alt{background:var(--coral);box-shadow:0 6px 0 #c9553a}
@keyframes pop{50%{transform:scale(1.12)}}

/* result + album */
.over{position:fixed;inset:0;overflow-y:auto;align-items:safe center;background:rgba(20,50,40,.55);display:grid;place-items:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));z-index:20}
.card-big{background:var(--card);border-radius:30px;padding:24px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);box-sizing:border-box}
.card-big h2{margin:0;font-size:34px;line-height:1.1;text-wrap:balance}
.bigstars{font-size:62px;letter-spacing:6px;margin:8px 0;color:var(--sun);text-shadow:0 4px 0 #d79a12}
.bigstars span{display:inline-block;animation:pop .5s backwards}
.bigstars .off{color:#e2dccd;text-shadow:none}
.newsticker{margin:8px auto 4px;width:130px;height:130px;border-radius:50%;background:#fff;border:6px dashed var(--sun);display:grid;place-items:center;font-size:76px;animation:spin .9s cubic-bezier(.4,1.6,.5,1) backwards .4s}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}}
.card-big p{font-size:19px;margin:8px 0 16px;color:var(--ink-soft);font-weight:600}
.card-big .rest{font-size:16px;background:#eef8f1;border-radius:14px;padding:8px 12px}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.album div{aspect-ratio:1;max-width:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:clamp(34px,9vw,48px);box-shadow:0 4px 0 var(--line)}
.album div.empty{background:#efe6d2;color:#cbbd9c;font-size:28px;font-weight:800;box-shadow:none}
.reset{margin-top:22px;font-size:16px;color:var(--ink-soft);text-decoration:underline;font-weight:600}
.confirm{margin-top:12px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:17px;font-weight:700}

.fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fx i{position:absolute;width:12px;height:16px;border-radius:3px;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="fox" aria-hidden="true">🦊</span><h1>Dikkat Macerası<small>Sezen Lina ile göz ve hafıza ormanı</small></h1></div>
    <button class="pill btn" id="soundBtn" aria-label="Sesi aç/kapat">🔊</button>
    <button class="pill btn" id="albumBtn" aria-label="Sticker albümü">📒 <span id="stkCount">0</span></button>
    <div class="pill" aria-label="Toplam yıldız">⭐ <span id="starCount">0</span></div>
  </header>

  <section id="mapScreen">
    <div class="notice" id="voiceNote" hidden>Bu cihazda Türkçe ses bulunamadı. Sesler farklı bir aksanla çıkabilir.</div>
    <div class="map" id="map"></div>
  </section>

  <section id="playScreen" hidden>
    <div class="bar" style="margin-top:12px">
      <button class="back" id="backBtn">← Harita</button>
      <div class="steps" id="steps"></div>
    </div>
    <div class="panel">
      <div class="guide">
        <span class="fox" aria-hidden="true">🦊</span>
        <div class="bubble" id="bubble"></div>
        <button class="listen" id="listenBtn" aria-label="Tekrar dinle">🔊</button>
      </div>
      <div class="stage" id="stage"></div>
    </div>
  </section>
</div>
<div id="overlay"></div>
<div class="fx" id="fx"></div>

<script>
/* ---------- veri ---------- */
const NAME = 'Sezen Lina';
const L = ['a','n','e','t','i','l'];
const SYL = ['na','ne','ni','la','le','li','ta','te','ti','an','en','in','al','el','il','at','et','it'];
// Benzer görünen harfler: göz ayırt etme çalışması için.
const LOOK = {a:['o','e','d'], n:['m','h','u'], e:['c','a','o'], t:['f','l','i'], i:['j','l','t'], l:['i','t','k']};
const WORDS = [
  {w:'at',e:'🐴'},{w:'el',e:'✋'},{w:'et',e:'🥩'},{w:'tel',e:'🧵'},{w:'nane',e:'🌿'},{w:'lale',e:'🌷'},
  {w:'anne',e:'👩'},{w:'nine',e:'👵'},{w:'anten',e:'📡'},{w:'tatil',e:'🏖️'},{w:'alet',e:'🔧'},{w:'ilan',e:'📢'}
];
const SHAPES = ['🐴','✋','🌷','🌿','🔧','📡','🐘','🦒','🐢','🐟','🦋','🍐','🚲','⛵','🎈','🐌','🦀','🌵','🔑','☂️','🐇','🦆'];
const ODD_EMO = [['🐟','🐠'],['🌷','🌹'],['🍎','🍅'],['🐱','🐯'],['🍋','🍌'],['🐶','🐺']];
const ODD_LET = [['n','m'],['e','c'],['t','f'],['a','o'],['N','M'],['E','F'],['i','j'],['L','T']];
const ODD_SYL = [['na','an'],['le','el'],['ti','it'],['ta','at'],['ne','en'],['li','il'],['la','al'],['ni','in']];
const PAT_EMO = ['🍎','🍐','⭐','🌙','🐸','🐟','🔺','🔵'];
const STOPS = [
  {name:'Aynısını Bul Koyu',icon:'🔍',sticker:'🦉',plan:['same','same','same','same','same','same']},
  {name:'Gölge Ormanı',icon:'🌲',sticker:'🦔',plan:['shadow','shadow','shadow','shadow','shadow','shadow']},
  {name:'Farklıyı Bul Tepesi',icon:'⛰️',sticker:'🦅',plan:['odd','odd','odd','odd','odd','odd']},
  {name:'Harf Avı Vadisi',icon:'🌾',sticker:'🦋',plan:['hunt','hunt','hunt','hunt','hunt','hunt']},
  {name:'Hafıza Mağarası',icon:'🕯️',sticker:'🐻',plan:['memo','missing','memo','missing','memo','missing']},
  {name:'Sıra Kulesi',icon:'🗼',sticker:'🐉',plan:['seq','order','seq','order','seq','order']},
  {name:'Dikkat Hazinesi',icon:'💎',sticker:'🏆',plan:'mix'}
];
const EXTRA = ['🐙','🦄','🐲','🚀','⛵','🗺️','🌈','⭐','🍦','🎈','🦖','🐝','🌻','🍉','🐳','🧁','🐼'];
const ALL_STICKERS = [...STOPS.map(i=>i.sticker), ...EXTRA];
const PRAISE = [`Aferin ${NAME}!`,`Harikasın ${NAME}!`,`Süper, ${NAME}!`,`Çok dikkatlisin ${NAME}!`,`Bravo ${NAME}!`,`Gözlerin kartal gibi ${NAME}!`];
const TRY = [`Devam et ${NAME}, sen yaparsın!`,`Başarabilirsin ${NAME}!`,`Bir daha bak ${NAME}.`,`Yavaşça bak ${NAME}, bulacaksın!`];

/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const pickN = (a,n,ex=[]) => shuffle(a.filter(x=>!ex.includes(x))).slice(0,n);
const up = s => s.toLocaleUpperCase('tr');
const low = s => s.toLocaleLowerCase('tr');
const wordOf = e => (WORDS.find(x=>x.e===e)||{}).w;

/* ---------- kayıt ---------- */
const KEY = 'dikkat-macera-v1';
let save = {stars:{}, plays:{}, stickers:[], sound:true};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) save = Object.assign(save, s); } catch(e){}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} };
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
// Yedek kodu: yıldızlar + stickerlar, başka cihaza veya temizlenen tarayıcıya taşımak için.
function makeCode(){ const d={s:save.stars,p:save.plays,k:save.stickers.map(x=>ALL_STICKERS.indexOf(x)).filter(x=>x>=0)}; return 'DKT-'+btoa(JSON.stringify(d)); }
function readCode(c){ try { const d=JSON.parse(atob(String(c).trim().replace(/^DKT-/i,''))); if(!d||typeof d.s!=='object'||!Array.isArray(d.k)) return null;
  return {stars:d.s, plays:d.p||{}, stickers:d.k.map(i=>ALL_STICKERS[i]).filter(Boolean)}; } catch(e){ return null; } }

/* ---------- ses ---------- */
let trVoice = null;
function loadVoices(){ try { const v = speechSynthesis.getVoices(); trVoice = v.find(x=>/^tr/i.test(x.lang)) || null; if (v.length) $('#voiceNote').hidden = !!trVoice; } catch(e){} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function say(parts, rate=0.85){
  if (!save.sound || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    (Array.isArray(parts)?parts:[parts]).forEach(p=>{
      const u = new SpeechSynthesisUtterance(p); u.lang='tr-TR'; if (trVoice) u.voice=trVoice;
      u.rate = rate; u.pitch = 1.1; speechSynthesis.speak(u);
    });
  } catch(e){}
}
let actx;
function tone(freqs, d=0.11){
  if (!save.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*d); g.gain.exponentialRampToValueAtTime(0.2,t+i*d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*d+d*2);
      o.connect(g).connect(actx.destination); o.start(t+i*d); o.stop(t+i*d+d*2.2); });
  } catch(e){}
}

/* ---------- soru üreticiler (k: turdaki sıra, zorluk yavaşça artar) ---------- */
function sylLook(s){
  const c = s.length===2 && L.includes(s[0]) && 'aei'.includes(s[1]) ? 'cv' : 'vc';
  const res = new Set([s[1]+s[0]]);
  const [ci,vi] = c==='cv'?[0,1]:[1,0];
  'aei'.split('').forEach(v=>{ if(v!==s[vi]){ const a=s.split(''); a[vi]=v; res.add(a.join('')); } });
  'ntl'.split('').forEach(x=>{ if(x!==s[ci]){ const a=s.split(''); a[ci]=x; res.add(a.join('')); } });
  res.delete(s); return [...res];
}
const G = {
  same(k){
    if (k<3){ const a=rnd(L), big=k===2; const f=x=>big?up(x):x;
      return {type:'same', answer:f(a), options:shuffle([a,...pickN(LOOK[a],3)]).map(f)}; }
    const s=rnd(SYL); return {type:'same', answer:s, options:shuffle([s,...pickN(sylLook(s),3)])};
  },
  shadow(k){ const n=k<3?3:4; const a=rnd(SHAPES); return {type:'shadow', answer:a, options:shuffle([a,...pickN(SHAPES,n-1,[a])])}; },
  odd(k){
    const set = k<2?ODD_EMO:k<4?ODD_LET:ODD_SYL, n = k<2?9:k<4?12:16;
    const [x,y] = shuffle(rnd(set)); const at=Math.floor(Math.random()*n);
    return {type:'odd', items:Array.from({length:n},(_,i)=>i===at?y:x), answer:at};
  },
  hunt(k){
    if (k<3){ const t=rnd(L), n=3+(k>0?1:0), others=L.filter(x=>x!==t);
      const items=shuffle([...Array(n).fill(t), ...Array.from({length:12-n},()=>rnd(others))]);
      return {type:'hunt', mode:'letter', target:t, items}; }
    const starts={}; WORDS.forEach(x=>(starts[x.w[0]]=starts[x.w[0]]||[]).push(x.w));
    const t=rnd(Object.keys(starts).filter(c=>starts[c].length>=2)), good=pickN(starts[t],3);
    const items=shuffle([...good, ...pickN(WORDS.map(x=>x.w).filter(w=>w[0]!==t),6-good.length)]);
    return {type:'hunt', mode:'word', target:t, items};
  },
  memo(k){
    if (k>=4){ const ws=pickN(WORDS,3); return {type:'memo', cards:shuffle(ws.flatMap(x=>[{v:x.e,id:x.w,emo:1},{v:x.w,id:x.w}]))}; }
    const ss=pickN(SYL,k<2?3:4); return {type:'memo', cards:shuffle(ss.flatMap(s=>[{v:s,id:s},{v:s,id:s}]))};
  },
  missing(k){ const n=Math.min(3+Math.floor(k/2),5); const items=pickN(SHAPES,n); const gone=Math.floor(Math.random()*n);
    return {type:'missing', items, gone, options:shuffle([items[gone],...pickN(SHAPES,2,items)])}; },
  seq(k){ const n=Math.min(2+Math.floor(k/2),4); const s=[]; while(s.length<n){ const i=Math.floor(Math.random()*6); if(s[s.length-1]!==i) s.push(i); }
    return {type:'seq', seq:s}; },
  order(k){
    let pat, items;
    if (k<2){ const [a,b]=pickN(PAT_EMO,2); items=[a,b]; pat=[a,b,a,b,a,b]; }
    else if (k<4){ const [a,b]=pickN(SYL,2); items=[a,b]; pat=[a,a,b,a,a,b]; }
    else { const [a,b,c]=pickN(SYL,3); items=[a,b,c]; pat=[a,b,c,a,b,c]; }
    const answer=pat[5], pool=k<2?PAT_EMO:SYL;
    const opts=new Set([answer, ...items]); pickN(pool,3,[...opts]).forEach(x=>{ if(opts.size<3) opts.add(x); });
    return {type:'order', shown:pat.slice(0,5), answer, emo:k<2, options:shuffle([...opts].slice(0,3))};
  }
};
function buildRound(plan){
  const types = plan==='mix' ? ['same','shadow','odd','hunt','missing','order'] : plan;
  return types.map((t,k)=>G[t](plan==='mix'?k+2:k));
}

/* ---------- harita ---------- */
const POS = [[26,0],[72,1],[30,2],[74,3],[26,4],[70,5],[50,6]];
const STEP = 170, TOP = 90;
function totalStars(){ return Object.values(save.stars).reduce((a,b)=>a+b,0); }
function unlocked(i){ return i===0 || save.stars[i-1]>0; }
function renderHeader(){
  $('#starCount').textContent = totalStars();
  $('#stkCount').textContent = save.stickers.length;
  $('#soundBtn').textContent = save.sound ? '🔊' : '🔇';
}
function renderMap(){
  renderHeader();
  const m=$('#map'); m.innerHTML='';
  const H = TOP*2 + STEP*(STOPS.length-1);
  m.style.height = H+'px';
  const pts = POS.map(([x,i])=>[x, TOP+i*STEP]);
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; d+=` C${x0} ${y0+STEP/2} ${x1} ${y1-STEP/2} ${x1} ${y1}`; }
  m.innerHTML = `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16" vector-effect="non-scaling-stroke"/></svg>`;
  const nextIdx = STOPS.findIndex((_,i)=>unlocked(i) && !save.stars[i]);
  STOPS.forEach((isl,i)=>{
    const lock=!unlocked(i), s=save.stars[i]||0;
    const b=el('button','isle'+(lock?' locked':'')+(i===nextIdx?' next':''));
    b.style.left=pts[i][0]+'%'; b.style.top=pts[i][1]+'px';
    b.innerHTML = `<span class="blob">${isl.icon}</span><span class="name">${isl.name}</span>`+
      `<span class="st">${lock?'':[0,1,2].map(k=>`<span class="${k<s?'':'off'}">★</span>`).join('')}</span>`+
      (lock?'<span class="lockico">🔒</span>':'')+(i===nextIdx?'<span class="here" aria-hidden="true">🦊</span>':'')+(save.cur&&save.cur.level===i?'<span class="resume">▶ Devam</span>':'');
    b.setAttribute('aria-label', isl.name + (lock?' (kilitli)':''));
    b.onclick = () => { if (lock){ tone([300,240]); say('Önce önceki durağı bitir!'); b.animate([{transform:'translate(-50%,-50%) rotate(-4deg)'},{transform:'translate(-50%,-50%) rotate(4deg)'},{transform:'translate(-50%,-50%)'}],{duration:300}); } else startLevel(i); };
    m.append(b);
  });
}

/* ---------- oyun ---------- */
let G_level=0, round=[], qi=0, mistakes=0, busy=false, replay=()=>{}, timers=[];
const later = (f,ms) => timers.push(setTimeout(f,ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers=[]; };
function show(id){ ['mapScreen','playScreen'].forEach(s=>$('#'+s).hidden = s!==id); window.scrollTo(0,0); }
function startLevel(i, fresh){
  G_level=i; const c=save.cur;
  if (!fresh && c && c.level===i && Array.isArray(c.round) && c.qi<c.round.length){ round=c.round; qi=c.qi; mistakes=c.mistakes||0; }
  else { round=buildRound(STOPS[i].plan); qi=0; mistakes=0; }
  show('playScreen'); nextQ();
}
function renderSteps(){ const s=$('#steps'); s.innerHTML=''; round.forEach((_,k)=>s.append(el('span',k<qi?'done':k===qi?'now':'',k<qi?'🐾':''))); }
function praise(extra){
  busy=true; tone([523,659,784,1046]); burst();
  const half = qi===2 ? [`Yarıladın, devam et ${NAME}!`] : [];
  say([...(extra?[extra]:[]), rnd(PRAISE), ...half], .95);
  later(()=>{ qi++; qi<round.length?nextQ():finish(); }, 1700);
}
function oops(b, keep){ mistakes++; tone([330,262],.13); if(b && keep){ b.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:300}); } else if(b){ b.classList.add('nope'); b.disabled=true; } say(rnd(TRY), .95); }
function choices(opts, fmt, isRight, cls='', after){
  const row=el('div','choices');
  opts.forEach(o=>{ const b=el('button','choice '+cls, fmt(o)); b.onclick=()=>{ if(busy) return; if(isRight(o)){ b.classList.add('right'); const x=after&&after(o); praise(x); } else oops(b); }; row.append(b); });
  return row;
}
const ask = (prompt, parts=[]) => { $('#bubble').textContent=prompt; replay=()=>say([prompt, ...parts]); say([prompt, ...parts]); };

function nextQ(){
  clearTimers(); busy=false; renderSteps();
  save.cur={level:G_level, round, qi, mistakes}; persist();
  const q=round[qi], st=$('#stage'); st.innerHTML='';

  switch(q.type){
  case 'same': {
    const syl=q.answer.length>1;
    ask(syl?'Bu heceyin aynısını bul.':'Bu harfin aynısını bul.', [low(q.answer)]);
    st.append(el('div','target',q.answer));
    st.append(choices(q.options, o=>o, o=>o===q.answer, syl?'mid':''));
    break; }
  case 'shadow': {
    ask('Bu gölge kimin? Bul bakalım!');
    st.append(el('div','target emo','<span class="shadow">'+q.answer+'</span>'));
    const w=el('div','word');
    st.append(choices(q.options, o=>o, o=>o===q.answer, 'emo', o=>{ st.querySelector('.shadow').classList.remove('shadow'); const ww=wordOf(o); if(ww){ w.textContent=ww; return ww; } }));
    st.append(w);
    break; }
  case 'odd': {
    ask('Hepsi aynı mı? Farklı olanı bul!');
    const emo=/\p{Extended_Pictographic}/u.test(q.items[0]);
    const g=el('div','grid '+(q.items.length===9?'c3':'c4'));
    q.items.forEach((x,i)=>{ const b=el('button','choice'+(emo?' emo':''),x);
      b.onclick=()=>{ if(busy) return; if(i===q.answer){ b.classList.add('right'); praise(); } else oops(b,true); }; g.append(b); });
    st.append(g);
    break; }
  case 'hunt': {
    const word=q.mode==='word', need=q.items.filter(x=>word?x[0]===q.target:x===q.target).length;
    ask(word?`“${q.target}” ile başlayan kelimeleri bul!`:`Bütün “${q.target}” harflerini bul!`, [word?`${q.target} ile başlayan kelimeler`:`${q.target}`]);
    st.append(el('div','target'+(word?'':''),q.target));
    const cnt=el('div','count'); let got=0; const upd=()=>cnt.textContent=`${got} / ${need} buldun`; upd();
    const row=el('div','huntrow');
    q.items.forEach(x=>{ const b=el('button','choice'+(word?' w':''),x);
      b.onclick=()=>{ if(busy||b.classList.contains('right')) return;
        if(word?x[0]===q.target:x===q.target){ b.classList.add('right'); got++; upd(); if(word) say(x); else tone([660,880]); if(got===need) praise(); }
        else oops(b,true); };
      row.append(b); });
    st.append(row, cnt);
    break; }
  case 'memo': {
    ask('Kartları çevir, eşlerini bul!');
    const g=el('div','grid '+(q.cards.length===6?'c3':'c4'));
    let open=[], done=0;
    q.cards.forEach(c=>{ const b=el('button','choice card','🍃'); b.setAttribute('aria-label','Kapalı kart');
      const face=()=>{ b.classList.add('open'); b.innerHTML=c.emo?c.v:`<span class="wd">${c.v}</span>`; };
      const hide=()=>{ b.classList.remove('open'); b.innerHTML='🍃'; };
      b.onclick=()=>{ if(busy||b.classList.contains('open')||b.classList.contains('mine')||open.length===2) return;
        face(); if(!c.emo) say(c.v); open.push({b,c,hide});
        if(open.length===2){ const [x,y]=open;
          if(x.c.id===y.c.id){ later(()=>{ [x,y].forEach(o=>{o.b.classList.remove('open'); o.b.classList.add('mine');}); open=[]; done++; tone([660,880]);
            if(done*2===q.cards.length) praise(); },350); }
          else later(()=>{ x.hide(); y.hide(); open=[]; },1100); } };
      g.append(b); });
    st.append(g);
    break; }
  case 'missing': {
    ask('İyice bak ve aklında tut. Hazır olunca düğmeye bas.');
    const row=el('div','row'); q.items.forEach(x=>row.append(el('div','item',x)));
    const ready=el('button','go','Aklımda tuttum 👀');
    st.append(row, ready);
    ready.onclick=()=>{ row.querySelectorAll('.item').forEach(d=>{d.className='item hide'; d.textContent='🍃';}); ready.remove(); tone([440,330]);
      later(()=>{ row.innerHTML=''; q.items.forEach((x,i)=>row.append(el('div',i===q.gone?'item q':'item',i===q.gone?'?':x)));
        ask('Hangisi kayboldu?');
        st.append(choices(q.options, o=>o, o=>o===q.items[q.gone], 'emo', ()=>{ const d=row.children[q.gone]; d.className='item'; d.textContent=q.items[q.gone]; })); },900); };
    break; }
  case 'seq': {
    const T=L.map(up);
    ask('Yanan harfleri izle, sonra aynı sırayla dokun.');
    const g=el('div','grid c3'); const btns=T.map((x,i)=>{ const b=el('button','choice',x); g.append(b); return b; });
    st.append(g);
    let pos=0;
    const flash=(i,ms=600)=>{ btns[i].classList.add('lit'); later(()=>btns[i].classList.remove('lit'),ms); };
    const play=()=>{ clearTimers(); busy=true; pos=0;
      q.seq.forEach((i,n)=>later(()=>{ flash(i); tone([392+i*60]); },1400+n*950));
      later(()=>{ busy=false; $('#bubble').textContent='Şimdi sen dokun!'; },1400+q.seq.length*950); };
    replay=()=>{ $('#bubble').textContent='Yanan harfleri izle, sonra aynı sırayla dokun.'; play(); };
    btns.forEach((b,i)=>b.onclick=()=>{ if(busy) return; flash(i,300); tone([392+i*60]);
      if(i===q.seq[pos]){ pos++; if(pos===q.seq.length) praise(); }
      else { mistakes++; busy=true; tone([330,262],.13); say(`Bir daha izleyelim ${NAME}.`); later(play,900); } });
    play();
    break; }
  case 'order': {
    ask('Sıradaki ne gelir? Diziye iyi bak!');
    const row=el('div','row'); q.shown.forEach(x=>row.append(el('div','item'+(q.emo?'':' syl'),x))); const qm=el('div','item q','?'); row.append(qm);
    st.append(row);
    st.append(choices(q.options, o=>o, o=>o===q.answer, q.emo?'emo':'mid', o=>{ qm.className='item'+(q.emo?'':' syl'); qm.textContent=o; return q.emo?null:q.shown.concat(o).join(' '); }));
    break; }
  }
}

function finish(){
  const i=G_level, stars = mistakes<=1?3:mistakes<=4?2:1;
  const first = !save.plays[i];
  delete save.cur;
  save.plays[i]=(save.plays[i]||0)+1;
  save.stars[i]=Math.max(save.stars[i]||0, stars);
  let sticker=null;
  if (!save.stickers.includes(STOPS[i].sticker)) sticker=STOPS[i].sticker;
  else { const left=EXTRA.filter(s=>!save.stickers.includes(s)); if(left.length) sticker=rnd(left); }
  if (sticker) save.stickers.push(sticker);
  persist(); renderHeader();
  const msg = stars===3?`Harikasın ${NAME}! Çok dikkatliydin!`:stars===2?`Çok iyi gidiyorsun ${NAME}!`:`Bitirdin ${NAME}! Tekrar oynarsan daha çok yıldız alırsın.`;
  const nextOpen = i<STOPS.length-1 && first;
  $('#overlay').innerHTML = `<div class="over"><div class="card-big">
    <h2>${STOPS[i].name} bitti!</h2>
    <div class="bigstars">${[0,1,2].map(k=>`<span class="${k<stars?'':'off'}" style="animation-delay:${k*.25}s">★</span>`).join('')}</div>
    <p>${msg}</p>
    ${sticker?`<div class="newsticker">${sticker}</div><p>Yeni sticker albümüne eklendi!</p>`:`<p>Albümün tamamen doldu. Harikasın!</p>`}
    ${nextOpen?`<p>Yeni durak açıldı: <b>${STOPS[i+1].name}</b> ${STOPS[i+1].icon}</p>`:''}
    <p class="rest">Göz molası: pencereden uzağa bak, 3 kez derin nefes al. 🌬️</p>
    <div class="btnrow"><button class="go" id="toMap">Haritaya dön</button><button class="go alt" id="again">Tekrar oyna</button></div>
  </div></div>`;
  tone([523,659,784,1046,1318],.13); burst(); burst();
  say([msg, ...(sticker?['Yeni bir sticker kazandın!']:[])], .9);
  $('#toMap').onclick=()=>{ $('#overlay').innerHTML=''; show('mapScreen'); renderMap(); };
  $('#again').onclick=()=>{ $('#overlay').innerHTML=''; startLevel(i, true); };
}

/* ---------- albüm ---------- */
function openAlbum(){
  const have=save.stickers;
  $('#overlay').innerHTML = `<div class="over"><div class="card-big">
    <h2>Sticker Albümüm</h2><p>${have.length} / ${ALL_STICKERS.length} sticker topladın. Her bitirdiğin durak yeni bir tane verir!</p>
    <div class="album">${ALL_STICKERS.map(s=>have.includes(s)?`<div>${s}</div>`:'<div class="empty">?</div>').join('')}</div>
    <div class="btnrow" style="margin-top:18px"><button class="go" id="closeAlbum">Kapat</button></div>
    <div class="backup"><b>Anne-baba için yedek kodu</b><span>İlerleme bu cihazda kendiliğinden kaydedilir. Tarayıcı temizlenirse ya da başka cihaza geçerseniz bu kodla geri yükleyin.</span>
      <textarea id="codeOut" readonly rows="2"></textarea><button class="go" id="copyCode">Kodu kopyala</button>
      <input id="codeIn" placeholder="Yedek kodunu buraya yapıştır" autocomplete="off"><button class="go alt" id="loadCode">Kodu yükle</button><div id="codeMsg" role="status"></div></div>
    <button class="reset" id="resetBtn">Baştan başla</button><div id="confirmBox"></div>
  </div></div>`;
  $('#closeAlbum').onclick=()=>{ $('#overlay').innerHTML=''; };
  $('#codeOut').value=makeCode();
  $('#copyCode').onclick=()=>{ const t=$('#codeOut'); const done=()=>$('#codeMsg').textContent='Kopyalandı. Bir yere not edin.';
    try { navigator.clipboard.writeText(t.value).then(done,()=>{ t.select(); $('#codeMsg').textContent='Kod seçildi, kopyalayın.'; }); } catch(e){ t.select(); } };
  $('#loadCode').onclick=()=>{ const d=readCode($('#codeIn').value);
    if(!d){ $('#codeMsg').textContent='Bu kod okunamadı. DKT- ile başlayan kodun tamamını yapıştırın.'; return; }
    // Kayıp olmasın: mevcut ilerlemeyle birleştir, her durakta en iyi yıldız kalsın.
    Object.entries(d.stars).forEach(([k,v])=>save.stars[k]=Math.max(save.stars[k]||0,v));
    Object.entries(d.plays).forEach(([k,v])=>save.plays[k]=Math.max(save.plays[k]||0,v));
    d.stickers.forEach(x=>{ if(!save.stickers.includes(x)) save.stickers.push(x); });
    persist(); renderMap(); openAlbum(); $('#codeMsg').textContent='İlerleme geri yüklendi!'; };
  $('#resetBtn').onclick=()=>{ $('#confirmBox').innerHTML='<div class="confirm">Tüm yıldızlar ve stickerlar silinsin mi? <button class="go alt" id="yes">Evet</button><button class="go" id="no">Hayır</button></div>';
    $('#yes').onclick=()=>{ save={stars:{},plays:{},stickers:[],sound:save.sound}; persist(); $('#overlay').innerHTML=''; show('mapScreen'); renderMap(); };
    $('#no').onclick=()=>{ $('#confirmBox').innerHTML=''; }; };
}

/* ---------- efekt ---------- */
function burst(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx=$('#fx'), cols=['#ffc63a','#ff7957','#76c96a','#2fb4c4','#b07cff'];
  for (let i=0;i<22;i++){ const c=el('i'); c.style.left='50%'; c.style.top='45%'; c.style.background=rnd(cols);
    c.style.setProperty('--dx',(Math.random()*500-250)+'px'); c.style.setProperty('--dy',(Math.random()*-320+120)+'px');
    fx.append(c); setTimeout(()=>c.remove(),1200); }
}

/* ---------- bağla ---------- */
$('#backBtn').onclick=()=>{ clearTimers(); try{speechSynthesis.cancel();}catch(e){} show('mapScreen'); renderMap(); };
$('#listenBtn').onclick=()=>replay();
$('#albumBtn').onclick=openAlbum;
$('#soundBtn').onclick=()=>{ save.sound=!save.sound; persist(); renderHeader(); if(!save.sound) try{speechSynthesis.cancel();}catch(e){} else say('Ses açık!'); };
renderMap();
</script>
